services:
  postgres:
    image: postgres:16-alpine
    container_name: propos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: propos
      POSTGRES_PASSWORD: propos_dev
      POSTGRES_DB: propos
    ports:
      - "5432:5432"
    volumes:
      - propos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U propos -d propos"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  propos_pgdata:
